name: Index auto update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GH_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install 'pyproj>=3.7'

      - name: Update the index
        run: python3 tools/update-index.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          commit-message: 'chore: :wrench: update all.json'
          branch: auto-index-update
          title: Automatic index update
          reviewers: DerZade
          delete-branch: true
